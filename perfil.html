<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>EMPRESA</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/js/all.min.js"
    ></script>
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/css/dashboard_ago320.css" />
    <link rel="stylesheet" href="./assets/css/dashboard_lms_set820.css" />
  </head>
  <body>
    <!-- menu top barra -->
    <nav
      class="navbar navbar-expand navbar-dark"
      style="background-color: #113524"
    >
      <a class="sidebar-toggle text-light mr-3">
        <span class="navbar-toggler-icon"></span>
      </a>
      <a class="navbar-brand" href="#">EMPRESA</a>
      <div class="collapse navbar-collapse">
        <!-- menu perfil -->
        <ul class="navbar-nav ml-auto">
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle menu-header"
              href="#"
              id="navbarDropdownMenuLink"
              data-toggle="dropdown"
            >
              <img
                class="rounded-circle"
                src="./assets/img/robson-250.png"
                width="20"
                height="20"
              />
              &nbsp;<span class="d-none d-sm-inline"> Robson</span>
            </a>
            <div
              class="dropdown-menu dropdown-menu-right"
              aria-labelledby="navbarDropdownMenuLink"
            >
              <a class="dropdown-item" href="perfil.html"
                ><i class="fas fa-user"></i> Perfil</a
              >
              <a class="dropdown-item" href="login.html"
                ><i class="fas fa-sign-out-alt"></i> Sair</a
              >
            </div>
          </li>
        </ul>
        <!-- menu perfil fim-->
      </div>
    </nav>
    <!-- menu top barra fim -->

    <!-- corpo da pagina -->
    <div class="d-flex">
      <!-- menu lado direito -->
      <nav class="sidebar">
        <ul class="list-unstyled">
          <li>
            <a href="index.html"
              ><i class="fas fa-tachometer-alt"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="usuarios.html"
              ><i class="fas fa-chalkboard-teacher"></i> Usuários</a
            >
          </li>
          <li>
            <a href="login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
          </li>
        </ul>
      </nav>
      <!-- menu lado direito fim -->

      <!-- conteudo da pagina -->
      <div class="content p-1">
        <div class="list-group-item">
          <div class="d-flex">
            <div class="mr-auto p-2">
              <h2 class="display-4 titulo">Editar Perfil</h2>
            </div>
            <div class="p-2">
              <a href="index.html" class="btn btn-outline-primary btn-sm"
                >Voltar</a
              >
            </div>
          </div>
          <hr />
          <form method="POST" action="" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group col-md-6">
                <label><span class="text-danger">*</span> Nome</label>
                <input
                  name="nome"
                  type="text"
                  class="form-control"
                  placeholder="Digite o nome completo"
                  value="Robson Mendonça"
                />
              </div>
              <div class="form-group col-md-6">
                <label><span class="text-danger">*</span> Apelido</label>
                <input
                  name="apelido"
                  type="text"
                  class="form-control"
                  placeholder="Como gostaria de ser chamado"
                  value=""
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-md-4">
                <label><span class="text-danger">*</span> E-mail</label>
                <input
                  name="email"
                  type="text"
                  class="form-control"
                  placeholder="Seu melhor e-mail"
                  value="seu@mail.com"
                />
              </div>
              <div class="form-group col-md-4">
                <label><span class="text-danger">*</span> Usuário</label>
                <input
                  name="usuario"
                  type="text"
                  class="form-control"
                  id="usuario"
                  placeholder="Digite o usuário"
                  value="seu@mail.com"
                />
              </div>
              <div class="form-group col-md-4">
                <label><span class="text-danger">*</span> CPF</label>
                <input
                  name="cpf"
                  type="text"
                  class="form-control"
                  id="cpf"
                  placeholder="Digite o CPF"
                  value="111.222.333-44"
                  im-insert="true"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <input
                  name="imagem_antiga"
                  type="hidden"
                  value="robson-250.png"
                />

                <label> Foto (150x150)</label>
                <input
                  name="imagem_nova"
                  type="file"
                  onchange="previewImagem();"
                />
              </div>
              <div class="form-group col-md-6">
                <img
                  src="./assets/img/robson-250.png"
                  alt="Imagem do Usuário"
                  id="preview-user"
                  class="img-thumbnail"
                  style="width: 150px; height: 150px"
                />
              </div>
            </div>

            <p><span class="text-danger">* </span>Campo obrigatório</p>
            <input
              name="EdiPerfil"
              type="submit"
              class="btn btn-warning"
              value="Salvar"
            />
          </form>
        </div>
      </div>
      <!-- conteudo da pagina fim-->
    </div>
    <!-- corpo da pagina fim-->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script
      type="text/javascript"
      src="https://rawgit.com/RobinHerbots/jquery.inputmask/3.x/dist/jquery.inputmask.bundle.js"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
      integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
      crossorigin="anonymous"
    ></script>
    <script src="./assets/js/dashboard.js"></script>
    <script src="./assets/js/dashboard-lms-set119.js"></script>
  </body>
</html>
