<!DOCTYPE html>
<html lang="pt-BR" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Atento Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-bg);
      padding: var(--sp-4);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--sp-8);
      text-align: center;
    }
    .login-logo {
      margin-bottom: var(--sp-6);
    }
    .login-logo img {
      height: 40px;
      width: auto;
    }
    .login-card h1 {
      font-size: var(--fs-xl);
      margin-bottom: var(--sp-2);
    }
    .login-card .subtitle {
      color: var(--text-secondary);
      font-size: var(--fs-sm);
      margin-bottom: var(--sp-6);
    }
    .login-form { text-align: left; }
    .login-form .form-group { margin-bottom: var(--sp-4); }
    .btn-login {
      width: 100%;
      height: 40px;
      font-size: var(--fs-base);
      margin-top: var(--sp-2);
    }
    .login-footer {
      margin-top: var(--sp-6);
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }
    .login-footer a { color: var(--color-primary); }
    
    /* Theme picker on login */
    .login-theme-picker {
      position: fixed;
      bottom: var(--sp-4);
      right: var(--sp-4);
      display: flex;
      gap: var(--sp-2);
      z-index: 100;
    }
    .theme-option {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--surface-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--ease);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-size: var(--fs-sm);
    }
    .theme-option:hover { transform: scale(1.1); }
    .theme-option.active { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-light); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Pular para conteúdo</a>
  
  <main class="login-page" id="main">
    <div class="card login-card">
      <div class="login-logo">
        <img src="https://login.atento.com.br/images/Atento_Logo_RGB_AtentoOrange.png" alt="Atento">
      </div>
      
      <h1>Bem-vindo</h1>
      <p class="subtitle">Plataforma de Alertas — Acesse sua conta</p>
      
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-control form-control-lg" placeholder="seu.email@atento.com.br" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-login">Entrar</button>
      </form>
      
      <div class="login-footer">
        <p>MVP Sprint 1 • <a href="index.html">Guia de Estilo</a></p>
      </div>
    </div>
  </main>
  
  <!-- Theme Picker -->
  <div class="login-theme-picker" id="theme-picker"></div>
  
  <script src="assets/js/app.js"></script>
  <script src="assets/js/themes.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email && password) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
