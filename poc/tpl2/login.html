<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMAÇÃO DEV — Plataforma Educacional</title>
  <meta name="description" content="Plataforma premium para formação de desenvolvedores.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- ======================== CSS ======================== -->
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Paleta */
      --bg-deep: #050505;
      --bg-primary: #0B0B0D;
      --bg-surface: #121212;
      --bg-elevated: #1A1A1D;
      --bg-input: rgba(255,255,255,0.04);

      --orange-1: #FF6A00;
      --orange-2: #FF7A00;
      --orange-3: #E24A1B;
      --orange-4: #FF3D00;
      --orange-accent: #FF8A00;
      --orange-glow: rgba(255, 106, 0, 0.35);

      --text-primary: #FFFFFF;
      --text-secondary: #D1D5DB;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;

      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --glass-strong: rgba(255,255,255,0.08);

      /* Tipografia */
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      /* Espaçamento */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      --space-3xl: 48px;
      --space-4xl: 64px;

      /* Bordas */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Sombras */
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 64px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 40px var(--orange-glow);
      --shadow-glow-lg: 0 0 80px rgba(255, 106, 0, 0.25);

      /* Transições */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 150ms var(--ease-out);
      --transition-base: 300ms var(--ease-out);
      --transition-slow: 600ms var(--ease-out);
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── LAYOUT PRINCIPAL ── */
    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* ── COLUNA ESQUERDA (70%) ── */
    .brand-section {
      width: 70%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
    }

    /* Canvas de partículas */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Overlay de gradiente cinematográfico */
    .brand-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(255, 106, 0, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 30% 70%, rgba(255, 61, 0, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 122, 0, 0.03) 0%, transparent 60%);
      z-index: 2;
      pointer-events: none;
      animation: breathe 8s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Noise overlay */
    .noise-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* Grid de linhas tech */
    .tech-grid {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.06;
    }

    .tech-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .tech-grid::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,106,0,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,106,0,0.15) 1px, transparent 1px);
      background-size: 200px 200px;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(200px, 200px); }
    }

    /* Linhas de conexão SVG */
    .connection-lines {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* ── LOGO CENTRAL ── */
    .logo-container {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: fadeInUp 1.2s var(--ease-out) both;
      animation-delay: 0.3s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      user-select: none;
    }

    .logo-formacao {
      font-weight: 200;
      font-size: clamp(1.8rem, 3.5vw, 3.2rem);
      letter-spacing: clamp(0.5em, 1.5vw, 1em);
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 40px rgba(255,106,0,0.15);
    }

    .logo-dev {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .logo-dev-letter {
      font-weight: 800;
      font-size: clamp(4rem, 8vw, 7.5rem);
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.02em;
      position: relative;
      text-shadow:
        0 0 60px rgba(255,106,0,0.2),
        0 0 120px rgba(255,106,0,0.08);
      animation: logoGlow 4s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      0% { text-shadow: 0 0 60px rgba(255,106,0,0.2), 0 0 120px rgba(255,106,0,0.08); }
      100% { text-shadow: 0 0 80px rgba(255,106,0,0.35), 0 0 160px rgba(255,106,0,0.12); }
    }

    /* V mosaico triangular */
    .letter-v-mosaic {
      position: relative;
      display: inline-block;
    }

    .v-mosaic-inner {
      font-weight: 800;
      font-size: clamp(4rem, 8vw, 7.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      position: relative;
      background: linear-gradient(135deg, var(--orange-1), var(--orange-2), var(--orange-accent), var(--orange-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(255,106,0,0.4));
    }

    .v-mosaic-polygons {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .v-mosaic-polygons polygon {
      fill: var(--orange-accent);
      opacity: 0.3;
      animation: polyPulse 3s ease-in-out infinite alternate;
    }

    .v-mosaic-polygons polygon:nth-child(1) { animation-delay: 0s; }
    .v-mosaic-polygons polygon:nth-child(2) { animation-delay: 0.5s; }
    .v-mosaic-polygons polygon:nth-child(3) { animation-delay: 1s; }
    .v-mosaic-polygons polygon:nth-child(4) { animation-delay: 1.5s; }
    .v-mosaic-polygons polygon:nth-child(5) { animation-delay: 2s; }

    @keyframes polyPulse {
      0% { opacity: 0.2; }
      100% { opacity: 0.6; }
    }

    /* ── ELEMENTOS FLUTUANTES ── */
    .floating-elements {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

    .float-card {
      position: absolute;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px;
      animation: float 6s ease-in-out infinite;
    }

    .float-card-1 {
      top: 12%;
      left: 8%;
      width: 180px;
      height: 100px;
      animation-delay: 0s;
    }

    .float-card-2 {
      bottom: 18%;
      left: 15%;
      width: 160px;
      height: 120px;
      animation-delay: 1.5s;
    }

    .float-card-3 {
      top: 20%;
      right: 18%;
      width: 200px;
      height: 80px;
      animation-delay: 3s;
    }

    .float-card-4 {
      bottom: 12%;
      right: 22%;
      width: 140px;
      height: 90px;
      animation-delay: 0.8s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(0.5deg); }
      75% { transform: translateY(8px) rotate(-0.5deg); }
    }

    /* Linhas dentro dos cards */
    .card-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-line {
      height: 4px;
      border-radius: 2px;
      background: var(--glass-strong);
    }

    .card-line.short { width: 60%; }
    .card-line.medium { width: 80%; }
    .card-line.indicator {
      width: 30px;
      height: 6px;
      background: var(--orange-1);
      border-radius: 3px;
      box-shadow: 0 0 12px var(--orange-glow);
    }

    .card-bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 50px;
      margin-top: 8px;
    }

    .bar {
      flex: 1;
      background: linear-gradient(to top, var(--orange-1), var(--orange-accent));
      border-radius: 3px 3px 0 0;
      opacity: 0.5;
      animation: barGrow 2s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
    .bar:nth-child(2) { height: 70%; animation-delay: 0.2s; }
    .bar:nth-child(3) { height: 55%; animation-delay: 0.4s; }
    .bar:nth-child(4) { height: 90%; animation-delay: 0.6s; }
    .bar:nth-child(5) { height: 35%; animation-delay: 0.8s; }

    @keyframes barGrow {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0.7); }
    }

    /* Cloud Icon */
    .cloud-icon {
      position: absolute;
      top: 8%;
      right: 12%;
      z-index: 7;
      opacity: 0.7;
      animation: float 7s ease-in-out infinite;
      animation-delay: 2s;
    }

    .cloud-icon svg {
      width: 60px;
      height: 40px;
      filter: drop-shadow(0 0 20px rgba(255,106,0,0.4));
    }

    /* Gear Icon */
    .gear-icon {
      position: absolute;
      bottom: 10%;
      left: 5%;
      z-index: 7;
      opacity: 0.5;
      animation: spinSlow 20s linear infinite;
    }

    .gear-icon svg {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 15px rgba(226, 74, 27, 0.5));
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Cursor gigante */
    .giant-cursor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      opacity: 0.04;
      pointer-events: none;
    }

    .giant-cursor svg {
      width: 300px;
      height: 300px;
      fill: var(--orange-1);
      filter: drop-shadow(0 0 60px rgba(255,106,0,0.3));
    }

    /* ── COLUNA DIREITA (30%) ── */
    .login-section {
      width: 30%;
      min-width: 380px;
      background: var(--bg-primary);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-2xl);
      border-left: 1px solid var(--glass-border);
      z-index: 20;
    }

    .login-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: -1px;
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, var(--orange-1), transparent);
      opacity: 0.3;
    }

    .login-panel {
      width: 100%;
      max-width: 340px;
      animation: fadeInRight 0.8s var(--ease-out) both;
      animation-delay: 0.5s;
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Header do login */
    .login-header {
      margin-bottom: var(--space-3xl);
    }

    .login-title {
      font-size: clamp(1.6rem, 2.5vw, 2rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.5;
    }

    /* ── FORMULÁRIO ── */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* Input Group */
    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .input-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: var(--text-dim);
      transition: color var(--transition-base);
      pointer-events: none;
      z-index: 2;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-field {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 48px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--transition-base);
      position: relative;
      z-index: 1;
    }

    .input-field::placeholder {
      color: var(--text-dim);
    }

    .input-field:hover {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
    }

    .input-field:focus {
      border-color: var(--orange-1);
      background: rgba(255,106,0,0.04);
      box-shadow: 0 0 0 3px rgba(255,106,0,0.1), 0 0 20px rgba(255,106,0,0.08);
    }

    .input-field:focus ~ .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--orange-1);
    }

    /* Toggle senha */
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
      z-index: 2;
      border-radius: 4px;
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── BOTÃO CTA ── */
    .btn-primary {
      position: relative;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--orange-1), var(--orange-2), var(--orange-4));
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition-base);
      box-shadow: 0 4px 20px rgba(255,106,0,0.3), 0 0 0 0 rgba(255,106,0,0);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--orange-accent), var(--orange-1));
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,106,0,0.4), 0 0 60px rgba(255,106,0,0.15);
    }

    .btn-primary:hover::before {
      opacity: 1;
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(255,106,0,0.3);
    }

    .btn-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Loading state */
    .btn-primary.loading .btn-text {
      opacity: 0;
    }

    .btn-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .btn-primary.loading .btn-spinner {
      opacity: 1;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Efeito ripple */
    .btn-primary .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin: var(--space-sm) 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .divider-text {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* ── LOGIN SOCIAL ── */
    .social-login {
      display: flex;
      justify-content: center;
    }

    .btn-social {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .btn-social:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-social:active {
      transform: translateY(0);
    }

    .btn-social svg {
      width: 22px;
      height: 22px;
      position: relative;
      z-index: 1;
    }

    .btn-social .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transform: scale(0);
      animation: ripple 0.5s ease-out;
      pointer-events: none;
    }

    /* ── LINK CADASTRO ── */
    .signup-link {
      text-align: center;
      margin-top: var(--space-xl);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .signup-link a {
      color: var(--orange-1);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: color var(--transition-fast);
    }

    .signup-link a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--orange-1);
      transition: width var(--transition-base);
    }

    .signup-link a:hover {
      color: var(--orange-accent);
    }

    .signup-link a:hover::after {
      width: 100%;
    }

    /* ── MENSAGEM DE ERRO ── */
    .error-message {
      font-size: 0.8rem;
      color: var(--orange-4);
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: var(--space-xs);
      animation: shake 0.4s ease-in-out;
    }

    .error-message.visible {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .error-message svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 100;
      background: linear-gradient(90deg, var(--orange-1), var(--orange-accent), var(--orange-4));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s var(--ease-out);
    }

    .status-bar.active {
      transform: scaleX(1);
      animation: statusPulse 2s ease-in-out;
    }

    @keyframes statusPulse {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.4s var(--ease-spring);
      z-index: 200;
      max-width: 360px;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .toast-icon.success svg {
      stroke: #22c55e;
    }

    .toast-icon.error svg {
      stroke: var(--orange-4);
    }

    .toast-message {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .toast-close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .toast-close svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ── PARALLAX LAYERS ── */
    .parallax-layer {
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* ── RESPONSIVO ── */
    @media (max-width: 1024px) {
      .brand-section {
        width: 60%;
      }
      .login-section {
        width: 40%;
        min-width: 320px;
      }
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }

      .brand-section {
        width: 100%;
        min-height: 45vh;
        padding: var(--space-3xl) var(--space-xl);
      }

      .brand-section::before {
        background:
          radial-gradient(ellipse 70% 50% at 50% 30%, rgba(255, 106, 0, 0.15) 0%, transparent 60%);
      }

      .login-section {
        width: 100%;
        min-width: auto;
        min-height: 55vh;
        border-left: none;
        border-top: 1px solid var(--glass-border);
        padding: var(--space-2xl) var(--space-xl);
      }

      .login-section::before {
        top: -1px;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--orange-1), transparent);
      }

      .float-card-1, .float-card-3, .float-card-4 {
        display: none;
      }

      .float-card-2 {
        width: 120px;
        height: 80px;
        bottom: 8%;
        left: 8%;
      }

      .giant-cursor {
        opacity: 0.02;
      }

      .giant-cursor svg {
        width: 200px;
        height: 200px;
      }

      .logo-formacao {
        letter-spacing: 0.3em;
      }
    }

    @media (max-width: 480px) {
      .login-section {
        padding: var(--space-xl) var(--space-lg);
      }

      .login-panel {
        max-width: 100%;
      }

      .brand-section {
        min-height: 40vh;
      }

      .float-card-2 {
        display: none;
      }
    }

    /* ── ACESSIBILIDADE ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .float-card, .cloud-icon, .gear-icon {
        animation: none !important;
      }
      #particles-canvas {
        display: none;
      }
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--orange-1);
      outline-offset: 2px;
    }

    .input-field:focus-visible {
      outline: none;
    }

    /* ── SELEÇÃO ── */

      background: var(--bg-elevated);

    }

</head>

  <script>
    /* ═══════════════════════════════════════════════
       FORMAÇÃO DEV — Premium Login Prototype
       Vanilla JS · No Dependencies
       ═══════════════════════════════════════════════ */

    (() => {
      'use strict';

      // ── UTILS ──
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => document.querySelectorAll(sel);

      // ── PARTICLES SYSTEM ──
      const ParticleSystem = (() => {
        const canvas = $('#particles-canvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let mouseX = 0, mouseY = 0;

        const CONFIG = {
          count: 60,
          maxSize: 2,
          minSize: 0.5,
          maxSpeed: 0.3,
          opacity: 0.4,
          connectionDistance: 120,
          connectionOpacity: 0.08,
          colors: [
            '255, 106, 0',
            '255, 122, 0',
            '255, 138, 0',
            '226, 74, 27'
          ]
        };

        function resize() {
          const parent = canvas.parentElement;
          canvas.width = parent.offsetWidth;
          canvas.height = parent.offsetHeight;
        }

        function createParticle() {
          return {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * CONFIG.maxSpeed,
            vy: (Math.random() - 0.5) * CONFIG.maxSpeed,
            size: Math.random() * (CONFIG.maxSize - CONFIG.minSize) + CONFIG.minSize,
            color: CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)],
            opacity: Math.random() * CONFIG.opacity + 0.1
          };
        }

        function init() {
          resize();
          particles = Array.from({ length: CONFIG.count }, createParticle);
          animate();
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Update & draw particles
          particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;

            // Bounce off edges
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            // Mouse interaction
            const dx = mouseX - p.x;
            const dy = mouseY - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              p.vx += dx * 0.00005;
              p.vy += dy * 0.00005;
            }

            // Draw particle
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`;
            ctx.fill();

            // Draw connections
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx2 = p.x - p2.x;
              const dy2 = p.y - p2.y;
              const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

              if (dist2 < CONFIG.connectionDistance) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(${p.color}, ${CONFIG.connectionOpacity * (1 - dist2 / CONFIG.connectionDistance)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          });

          animationId = requestAnimationFrame(animate);
        }

        function handleMouseMove(e) {
          const rect = canvas.getBoundingClientRect();
          mouseX = e.clientX - rect.left;
          mouseY = e.clientY - rect.top;
        }

        function destroy() {
          cancelAnimationFrame(animationId);
        }

        window.addEventListener('resize', () => {
          resize();
        });

        canvas.parentElement.addEventListener('mousemove', handleMouseMove);

        init();

        return { destroy };
      })();


      // ── PARALLAX ──
      const Parallax = (() => {
        const layers = $$('.parallax-layer');
        if (!layers.length) return;

        let ticking = false;

        function update(e) {
          if (ticking) return;
          ticking = true;

          requestAnimationFrame(() => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            layers.forEach(layer => {
              const depth = parseFloat(layer.dataset.depth) || 0.02;
              const moveX = (e.clientX - centerX) * depth;
              const moveY = (e.clientY - centerY) * depth;
              layer.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            ticking = false;
          });
        }

        window.addEventListener('mousemove', update);
      })();


      // ── PASSWORD TOGGLE ──
      const PasswordToggle = (() => {
        const toggle = $('#passwordToggle');
        const input = $('#password');
        const eyeIcon = toggle.querySelector('.icon-eye');
        const eyeOffIcon = toggle.querySelector('.icon-eye-off');

        toggle.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          eyeIcon.style.display = isPassword ? 'none' : 'block';
          eyeOffIcon.style.display = isPassword ? 'block' : 'none';
          toggle.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
        });
      })();


      // ── RIPPLE EFFECT ──
      const RippleEffect = (() => {
        function createRipple(e, element) {
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');

          const rect = element.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);

          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

          element.appendChild(ripple);

          ripple.addEventListener('animationend', () => {
            ripple.remove();
          });
        }

        $$('.btn-primary, .btn-social').forEach(btn => {
          btn.addEventListener('click', (e) => createRipple(e, btn));
        });
      })();


      // ── FORM VALIDATION & AUTH FLOW ──
      const AuthFlow = (() => {
        const form = $('#loginForm');
        const emailInput = $('#email');
        const passwordInput = $('#password');
        const submitBtn = $('#submitBtn');
        const emailError = $('#emailError');
        const passwordError = $('#passwordError');
        const statusBar = $('#statusBar');
        const toast = $('#toast');
        const toastMessage = $('#toastMessage');
        const toastIcon = $('#toastIcon');
        const toastClose = $('#toastClose');

        let toastTimeout;

        function showError(element, message) {
          const span = element.querySelector('span');
          if (span) span.textContent = message;
          element.classList.add('visible');
        }

        function hideError(element) {
          element.classList.remove('visible');
        }

        function validateEmail(email) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showToast(message, type = 'success') {
          clearTimeout(toastTimeout);

          toastMessage.textContent = message;

          if (type === 'success') {
            toastIcon.className = 'toast-icon success';
            toastIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
          } else {
            toastIcon.className = 'toast-icon error';
            toastIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
          }

          toast.classList.add('visible');

          toastTimeout = setTimeout(() => {
            toast.classList.remove('visible');
          }, 4000);
        }

        function closeToast() {
          clearTimeout(toastTimeout);
          toast.classList.remove('visible');
        }

        toastClose.addEventListener('click', closeToast);

        // Real-time validation
        emailInput.addEventListener('input', () => {
          hideError(emailError);
        });

        passwordInput.addEventListener('input', () => {
          hideError(passwordError);
        });

        // Submit
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          let hasError = false;

          // Validate email
          if (!emailInput.value.trim()) {
            showError(emailError, 'Email é obrigatório');
            hasError = true;
          } else if (!validateEmail(emailInput.value.trim())) {
            showError(emailError, 'Insira um email válido');
            hasError = true;
          }

          // Validate password
          if (!passwordInput.value.trim()) {
            showError(passwordError, 'Senha é obrigatória');
            hasError = true;
          } else if (passwordInput.value.length < 6) {
            showError(passwordError, 'Senha deve ter no mínimo 6 caracteres');
            hasError = true;
          }

          if (hasError) return;

          // Loading state
          submitBtn.classList.add('loading');
          submitBtn.disabled = true;

          // Status bar animation
          statusBar.classList.add('active');
          setTimeout(() => statusBar.classList.remove('active'), 2000);

          // Fake auth delay
          await new Promise(resolve => setTimeout(resolve, 1800));

          // Success
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;

          showToast('Login realizado com sucesso! Redirecionando...', 'success');

          // Reset form
          form.reset();
        });

        // Google button
        const googleBtn = $('#googleBtn');
        googleBtn.addEventListener('click', async () => {
          googleBtn.classList.add('loading');
          await new Promise(resolve => setTimeout(resolve, 1200));
          googleBtn.classList.remove('loading');
          showToast('Conectando com Google...', 'success');
        });

        // Signup link
        const signupLink = $('#signupLink');
        signupLink.addEventListener('click', (e) => {
          e.preventDefault();
          showToast('Página de cadastro em breve!', 'success');
        });
      })();


      // ── ENTRANCE ANIMATIONS ──
      const EntranceAnimations = (() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.style.animationPlayState = 'running';
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        $$('.float-card, .logo-container, .login-panel').forEach(el => {
          el.style.animationPlayState = 'paused';
          observer.observe(el);
        });
      })();


      // ── KEYBOARD ACCESSIBILITY ──
      document.addEventListener('keydown', (e) => {
        // Enter on social button
        if (e.key === 'Enter' && document.activeElement.classList.contains('btn-social')) {
          document.activeElement.click();
        }
      });

      // ── CLEANUP ON PAGE HIDE ──
      window.addEventListener('beforeunload', () => {
        if (ParticleSystem) ParticleSystem.destroy();
      });

    })();
  </script>

</body>
</html>
